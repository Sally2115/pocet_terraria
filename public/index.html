<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pocket Terraria - Micro Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #050b14; overflow: hidden; touch-action: none;
    user-select: none; -webkit-user-select: none;
    font-family: 'Press Start 2P', monospace; color: #fff;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  
  /* Шкалы */
  #stats-panel {
    position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 4px;
  }
  .bar-box {
    width: 130px; height: 12px; background: #111; border: 2px solid #333;
    position: relative; box-shadow: 0 2px 0 #000;
  }
  .bar-fill { height: 100%; transition: width 0.1s; }
  #hp-fill { background: #e74c3c; width: 100%; }
  #arm-fill { background: #3498db; width: 0%; }
  .bar-text {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 5px; text-shadow: 1px 1px 0 #000;
  }

  /* Хотбар */
  #hotbar {
    position: absolute; top: 40px; left: 10px; display: flex; gap: 3px; pointer-events: auto;
  }
  .slot {
    width: 30px; height: 30px; background: #2a1f18; border: 2px solid #5c4033;
    display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer;
  }
  .slot.active { border-color: #f1c40f; background: #4a3525; box-shadow: 0 0 5px #f1c40f88; }
  .slot i { width: 14px; height: 14px; display: block; image-rendering: pixelated; }
  .slot u { position: absolute; right: 2px; bottom: 1px; font-size: 5px; text-decoration: none; text-shadow: 1px 1px 0 #000; }

  /* Кнопки управления */
  .btn {
    position: absolute; background: #2a1f18; border: 2px solid #5c4033;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; pointer-events: auto; touch-action: none; color: #f1c40f;
    box-shadow: 0 3px 0 #000;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
  #btn-l { left: 10px; bottom: 12px; width: 48px; height: 48px; }
  #btn-r { left: 64px; bottom: 12px; width: 48px; height: 48px; }
  #btn-j { right: 10px; bottom: 12px; width: 56px; height: 56px; font-size: 16px; }
  #btn-a { right: 72px; bottom: 12px; width: 48px; height: 48px; font-size: 14px; color: #e74c3c; }
  #btn-c { right: 10px; top: 10px; width: 38px; height: 38px; font-size: 14px; }

  /* Меню */
  #panel {
    position: absolute; inset: 55px 10px 75px; background: #1a130e; border: 3px solid #5c4033;
    padding: 8px; overflow-y: auto; display: none; pointer-events: auto; z-index: 20;
  }
  .panel-title { font-size: 8px; color: #f1c40f; margin-bottom: 6px; border-bottom: 2px solid #5c4033; padding-bottom: 3px; }
  .r { display: flex; justify-content: space-between; align-items: center; background: #281d15; border: 2px solid #3d2c20; padding: 5px; margin-bottom: 3px; font-size: 6px; }
  .r button { background: #27ae60; border: 2px solid #1e8449; color: #fff; font-family: inherit; font-size: 6px; padding: 4px 6px; cursor: pointer; }
  .r button:disabled { background: #444; border-color: #222; opacity: 0.5; }
  #msg { position: absolute; bottom: 75px; left: 0; right: 0; text-align: center; font-size: 7px; color: #f1c40f; text-shadow: 1px 1px #000; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="stats-panel">
    <div class="bar-box"><div class="bar-fill" id="hp-fill"></div><div class="bar-text" id="hp-txt">100 / 100</div></div>
    <div class="bar-box"><div class="bar-fill" id="arm-fill"></div><div class="bar-text" id="arm-txt">Защита: 0</div></div>
  </div>
  <div id="hotbar"></div>
  <div class="btn" id="btn-c">📦</div>
  <div class="btn" id="btn-l">◀</div>
  <div class="btn" id="btn-r">▶</div>
  <div class="btn" id="btn-a">⚔️</div>
  <div class="btn" id="btn-j">▲</div>
  <div id="panel"></div>
  <div id="msg"></div>
</div>

<script>
const W = 350, H = 140; // Большой мир
const T = {
  1: { c: '#5c4033', h: 1, d: 1, n: 'Земля' },
  2: { c: '#2ecc71', h: 1, d: 1, n: 'Трава' },
  3: { c: '#7f8c8d', h: 3, d: 3, n: 'Камень' },
  4: { c: '#795548', h: 1.5, d: 8, n: 'Дерево' },
  5: { c: '#27ae60', h: 0.3, d: 0, n: 'Листва' },
  6: { c: '#e67e22', h: 4, d: 6, n: 'Медь' },
  7: { c: '#bdc3c7', h: 5, d: 7, n: 'Железо' },
  8: { c: '#8d6e63', h: 2, d: 8, n: 'Доски' },
  9: { c: '#f1c40f', h: 0.1, d: 9, n: 'Факел' },
  10:{ c: '#d35400', h: 1, d: 10, n: 'Верстак' },
  11:{ c: '#f39c12', h: 6, d: 11, n: 'Золото' }
};

const ITEMS = {
  1:'Земля', 3:'Камень', 6:'Медная руда', 7:'Железная руда', 8:'Доски', 9:'Факел', 10:'Верстак', 11:'Золотая руда',
  20:'Кожа', 21:'Гель', 22:'Железный слиток', 23:'Золотой слиток', 24:'Кожаная броня', 25:'Железная броня'
};

const SOLID = new Set([1,2,3,4,6,7,8,10,11]);
let tiles = new Uint8Array(W * H), surf = [];

function gen() {
  for (let x = 0; x < W; x++) {
    const s = Math.floor(35 + Math.sin(x * 0.04) * 8 + Math.cos(x * 0.01) * 12);
    surf[x] = s;
    for (let y = 0; y < H; y++) {
      let id = 0;
      if (y >= s) {
        id = (y === s) ? 2 : (y < s + 5 ? 1 : 3);
        if (id === 3) {
          const r = Math.random();
          if (r < 0.04) id = 6;
          else if (r < 0.075) id = 7;
          else if (r < 0.09) id = 11;
        }
        if (y > s + 6 && Math.sin(x * 0.25) * Math.cos(y * 0.25) > 0.62) id = 0;
      }
      tiles[y * W + x] = id;
    }
  }
}
gen();

// Ультра-маленький персонаж (размером меньше блока: ширина 0.5, высота 1.1)
const P = {
  x: W / 2, y: 10, w: 0.5, h: 1.1, vx: 0, vy: 0,
  on: false, hp: 100, maxHp: 100, armor: 0,
  face: 1, hurt: 0, sword: 0, pick: 0, swing: 0
};

let inv = { 8: 15, 9: 10 }, sel = 0, mobs = [], keys = {}, aim = { d: false, x: 0, y: 0, id: -1 }, mine = { x: -1, y: -1, p: 0 }, cd = 0;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let ts = 12, VW = 0, VH = 0, cx = 0, cy = 0; // Маленький размер тайла (ts=12) для максимального обзора экрана

function rs() {
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  ctx.imageSmoothingEnabled = false;
  ts = Math.max(10, Math.floor(cv.width / 36)); // Очень широкий охват камеры
  VW = cv.width / ts; VH = cv.height / ts;
}
addEventListener('resize', rs); rs();

// Управление
const hold = { l: 0, r: 0, j: 0 };
['l', 'r', 'j'].forEach(k => {
  const el = document.getElementById('btn-' + k);
  if (!el) return;
  el.onpointerdown = e => { hold[k] = 1; el.setPointerCapture(e.pointerId); e.preventDefault(); };
  el.onpointerup = el.onpointercancel = el.onpointerleave = () => hold[k] = 0;
});

document.getElementById('btn-a').onclick = () => attack();

function attack() {
  P.swing = 0.2;
  const range = 2.0;
  mobs.forEach(m => {
    const dist = Math.hypot((m.x + m.w/2) - (P.x + P.w/2), (m.y + m.h/2) - (P.y + P.h/2));
    if (dist < range) {
      const dmg = 10 + P.sword * 10;
      m.hp -= dmg;
      m.vy = -4; m.vx = P.face * 4;
      say('Урон мобу: -' + dmg);
    }
  });
}

addEventListener('keydown', e => {
  keys[e.code] = 1;
  if (/Digit[1-9]/.test(e.code)) { sel = +e.code.slice(5) - 1; hbRender(); }
});
addEventListener('keyup', e => keys[e.code] = 0);

const sc = e => ({ x: e.clientX / ts + cx, y: e.clientY / ts + cy });
cv.onpointerdown = e => { if (aim.id >= 0) return; aim.id = e.pointerId; aim.d = true; Object.assign(aim, sc(e)); cv.setPointerCapture(e.pointerId); };
cv.onpointermove = e => { if (e.pointerId == aim.id) Object.assign(aim, sc(e)); };
cv.onpointerup = cv.onpointercancel = e => { if (e.pointerId == aim.id) { aim.d = false; aim.id = -1; mine.p = 0; } };

function items() {
  const a = ['sword', 'pick'];
  Object.keys(inv).map(Number).sort((a,b)=>a-b).forEach(k => { if (inv[k] > 0) a.push(k); });
  return a;
}

function hbRender() {
  const it = items(); if (sel >= it.length) sel = 0;
  const hb = document.getElementById('hotbar'); hb.innerHTML = '';
  it.forEach((k, i) => {
    const d = document.createElement('div');
    d.className = 'slot' + (i == sel ? ' active' : '');
    const col = typeof k == 'number' ? (T[k] ? T[k].c : '#9b59d6') : (k == 'sword' ? '#e74c3c' : '#3498db');
    d.innerHTML = `<i style="background:${col}"></i><u>${typeof k == 'number' ? inv[k] : ''}</u>`;
    d.onclick = () => { sel = i; hbRender(); };
    hb.appendChild(d);
  });
}
hbRender();

function say(t) {
  const m = document.getElementById('msg'); m.textContent = t;
  clearTimeout(say.t); say.t = setTimeout(() => m.textContent = '', 2000);
}

const REC = [
  { n: 'Верстак', c: { 8: 5 }, o: [10, 1] },
  { n: 'Факелы x4', c: { 8: 1, 21: 1 }, o: [9, 4] },
  { n: 'Железный слиток', c: { 7: 3 }, o: [22, 1] },
  { n: 'Железный меч', c: { 22: 4, 8: 2 }, type: 's1' },
  { n: 'Кожаная броня (+15 Защиты)', c: { 20: 5 }, type: 'a15' },
  { n: 'Железная броня (+30 Защиты)', c: { 22: 8 }, type: 'a30' }
];

function craftUI() {
  const p = document.getElementById('panel');
  p.innerHTML = '<div class="panel-title">ИНВЕНТАРЬ И КРАФТ</div>';
  REC.forEach(r => {
    const ok = Object.entries(r.c).every(([k, v]) => (inv[k] || 0) >= v);
    const d = document.createElement('div'); d.className = 'r';
    let reqs = Object.entries(r.c).map(([k,v])=> `${ITEMS[k]||'?'}:${v}`).join(', ');
    d.innerHTML = `<span><b>${r.n}</b><br><small style="color:#aaa">${reqs}</small></span>`;
    const b = document.createElement('button'); b.textContent = 'Крафт'; b.disabled = !ok;
    b.onclick = () => {
      for (const k in r.c) inv[k] -= r.c[k];
      if (r.type == 's1') P.sword = 1;
      else if (r.type == 'a15') P.armor = 15;
      else if (r.type == 'a30') P.armor = 30;
      else if (r.o) inv[r.o[0]] = (inv[r.o[0]] || 0) + r.o[1];
      craftUI(); hbRender(); say('Скрафчено: ' + r.n);
    };
    d.appendChild(b); p.appendChild(d);
  });
}

document.getElementById('btn-c').onclick = () => {
  const p = document.getElementById('panel');
  p.style.display = p.style.display == 'block' ? 'none' : 'block';
  if (p.style.display == 'block') craftUI();
};

function hit(e) {
  for (let y = Math.floor(e.y); y <= Math.floor(e.y + e.h - 0.01); y++)
    for (let x = Math.floor(e.x); x <= Math.floor(e.x + e.w - 0.01); x++)
      if (x < 0 || x >= W || y < 0 || y >= H || SOLID.has(tiles[y * W + x])) return true;
  return false;
}

let mobTimer = 0;
function update(dt) {
  const l = hold.l || keys.KeyA || keys.ArrowLeft, r = hold.r || keys.KeyD || keys.ArrowRight, j = hold.j || keys.Space || keys.KeyW || keys.ArrowUp;
  const tv = (r - l) * 8; if (tv) P.face = tv > 0 ? 1 : -1;
  P.vx += (tv - P.vx) * Math.min(1, dt * 20);
  
  if (j && P.on) { P.vy = -14; P.on = false; }
  P.vy = Math.min(P.vy + 45 * dt, 30);
  P.hurt = Math.max(0, P.hurt - dt);
  P.swing = Math.max(0, P.swing - dt);

  P.x += P.vx * dt;
  if (hit(P)) { P.x = P.vx > 0 ? Math.floor(P.x + P.w) - P.w - 0.001 : Math.floor(P.x) + 1.001; P.vx = 0; }

  P.y += P.vy * dt; P.on = false;
  if (hit(P)) {
    if (P.vy > 0) { P.y = Math.floor(P.y + P.h) - P.h - 0.001; P.on = true; }
    else { P.y = Math.floor(P.y) + 1.001; }
    P.vy = 0;
  }

  if (P.y > H || P.hp <= 0) { P.x = W / 2; P.y = 10; P.vy = 0; P.hp = 100; say('Возрождение!'); }

  cd -= dt;
  if (aim.d) {
    const tx = Math.floor(aim.x), ty = Math.floor(aim.y);
    const dist = Math.hypot(aim.x - (P.x + P.w / 2), aim.y - (P.y + P.h / 2));
    const it = items()[sel];

    if (it == 'pick' && dist < 6) {
      const idx = ty * W + tx;
      if (tx >= 0 && tx < W && ty >= 0 && ty < H && tiles[idx] > 0) {
        mine.p += dt;
        if (mine.p >= 0.25) {
          const t = tiles[idx]; tiles[idx] = 0;
          if (T[t] && T[t].d) { inv[T[t].d] = (inv[T[t].d] || 0) + 1; hbRender(); }
          mine.p = 0;
        }
      }
    } else if (typeof it == 'number' && dist < 6 && cd <= 0 && inv[it] > 0) {
      const idx = ty * W + tx;
      if (tx >= 0 && tx < W && ty >= 0 && ty < H && tiles[idx] == 0) {
        tiles[idx] = it; inv[it]--; cd = 0.12; hbRender();
      }
    }
  }

  // Спавн мобов
  mobTimer += dt;
  if (mobTimer > 5 && mobs.length < 5) {
    mobTimer = 0;
    const mx = P.x + (Math.random() < 0.5 ? -20 : 20);
    const my = surf[Math.floor(Math.max(0, Math.min(W-1, mx)))] - 2;
    if (mx > 2 && mx < W - 2) mobs.push({ x: mx, y: my, w: 0.6, h: 0.8, hp: 20, vx: 0, vy: 0 }); // Ультра-маленький моб
  }

  mobs = mobs.filter(m => {
    m.vy = Math.min(m.vy + 40 * dt, 30);
    m.vx = (P.x > m.x ? 1 : -1) * 2.2;
    
    m.x += m.vx * dt;
    m.y += m.vy * dt;

    if (P.hurt <= 0 && Math.abs(P.x - m.x) < 0.6 && Math.abs(P.y - m.y) < 0.9) {
      const realDmg = Math.max(2, 10 - P.armor * 0.3);
      P.hp -= realDmg; P.hurt = 0.8;
      P.vy = -5; P.vx = (P.x < m.x ? -1 : 1) * 4;
      say('Урон: -' + Math.floor(realDmg));
    }

    if (m.hp <= 0) {
      inv[20] = (inv[20] || 0) + 1;
      inv[21] = (inv[21] || 0) + 2;
      hbRender(); say('Моб повержен!');
      return false;
    }
    return Math.abs(m.x - P.x) < 40;
  });
}

function draw() {
  ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, cv.width, cv.height);

  cx = Math.max(0, Math.min(W - VW, P.x + P.w / 2 - VW / 2));
  cy = Math.max(0, Math.min(H - VH, P.y + P.h / 2 - VH / 2));

  const x0 = Math.floor(cx), y0 = Math.floor(cy), x1 = Math.ceil(cx + VW), y1 = Math.ceil(cy + VH);

  // Отрисовка тайлов
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const t = tiles[y * W + x];
      if (t > 0) {
        ctx.fillStyle = T[t] ? T[t].c : '#444';
        ctx.fillRect(Math.floor((x - cx) * ts), Math.floor((y - cy) * ts), Math.ceil(ts), Math.ceil(ts));
      }
    }
  }

  // Отрисовка маленьких мобов
  mobs.forEach(m => {
    ctx.fillStyle = '#2ecc71';
    ctx.fillRect(Math.floor((m.x - cx) * ts), Math.floor((m.y - cy) * ts), Math.floor(m.w * ts), Math.floor(m.h * ts));
  });

  // Отрисовка ЧЕТКОГО И УЛЬТРА-МАЛЕНЬКОГО ПЕРСОНАЖА
  const px = Math.floor((P.x - cx) * ts), py = Math.floor((P.y - cy) * ts);
  const pw = Math.floor(P.w * ts), ph = Math.floor(P.h * ts);

  if (P.hurt > 0 && Math.floor(Date.now() / 80) % 2) ctx.globalAlpha = 0.4;

  // Тело персонажа
  ctx.fillStyle = P.armor > 0 ? (P.armor > 20 ? '#bdc3c7' : '#8d6e63') : '#e74c3c';
  ctx.fillRect(px, py + ph * 0.3, pw, ph * 0.7);

  // Голова
  ctx.fillStyle = '#ffcc99';
  ctx.fillRect(px + pw * 0.1, py, pw * 0.8, ph * 0.35);

  // Оружие в руке при ударе
  if (P.swing > 0) {
    ctx.fillStyle = P.sword > 0 ? '#bdc3c7' : '#7f8c8d';
    ctx.fillRect(px + (P.face > 0 ? pw : -pw * 0.8), py + ph * 0.4, pw * 0.8, ph * 0.2);
  }

  ctx.globalAlpha = 1.0;

  // Обновление интерфейса
  document.getElementById('hp-fill').style.width = Math.max(0, P.hp) + '%';
  document.getElementById('hp-txt').textContent = `${Math.max(0, Math.floor(P.hp))} / 100`;
  document.getElementById('arm-fill').style.width = Math.min(100, (P.armor / 30) * 100) + '%';
  document.getElementById('arm-txt').textContent = `Защита: ${P.armor}`;
}

let last = performance.now();
function loop(n) {
  const dt = Math.min(0.033, (n - last) / 1000); last = n;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
