let AC,hum;
function aud(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=48;g.gain.value=M.amb/100*.04;o.connect(g).connect(AC.destination);o.start();hum=g}catch(e){}}
function beep(){aud();if(!AC)return;try{const n=4410,b=AC.createBuffer(1,n,44100),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=M.fx/100*.25;s.buffer=b;s.connect(g).connect(AC.destination);s.start()}catch(e){}}

/* ===== механика ===== */
function ap(f){
  const d=DF[S.d];
  if(f.h)S.hp=cl(S.hp+(f.h<0?f.h*d.h:f.h));
  if(f.s)S.san=cl(S.san+(f.s<0?f.s*d.s:f.s));
  if(f.b)S.bat=cl(S.bat+f.b);
  if(f.u)S.u=cl(S.u+(f.u>0?f.u*d.u:f.u));
  if(f.d)S.ds=cl(S.ds+f.d);
  if(f.t)S.tr=cl(S.tr+f.t);
  [].concat(f.g||[]).forEach(i=>{if(S.inv.length<6)S.inv.push(i);else note('Инвентарь полон. «'+i+'» оставлен.')});
  if(f.c&&!S.cl.includes(f.c)){S.cl.push(f.c);if(!M.seen.includes(f.c)){M.seen.push(f.c);saveM()}note('АРХИВ: '+CL[f.c][0])}
  if(f.f)S.fl[f.f]=1;
}
function choose(i){
  beep();
  const sc=SC[S.sc],c=sc.c[i];let e=c.e||{},n=c.n;
  if(c.r&&!has(c.r)){e=c.e2||{};n=c.n2||n;note('Не хватило: '+nm(c.r))}
  ap(e);
  if(sc.dg&&c.k){
    const k=c.k,t=S.us[k]||0;S.us[k]=t+1;
    if(S.d=='hard'&&t>=1){ap({h:-30});note('Смотритель запомнил этот приём.')}
    else if(S.d=='mid'&&t>=2){ap({h:-15});note('Приём работает хуже: он адаптируется.')}
    if(k=='hide'&&S.u>70){ap({h:-20});note('Укрытие небезопасно: он проверил шкаф.')}
    if(k=='run'&&Math.random()<.3&&S.inv.length){note('Потеряно при побеге: '+S.inv.splice(Math.random()*S.inv.length|0,1)[0])}
  }
  ap({b:-DF[S.d].bt});
  if(S.bat<=0)ap({s:-4});
  if(S.u>=100){ap({h:-25});S.u=50;note('Смотритель нашёл тебя.')}
  if(S.san<=0)ap({h:-10});
  if(typeof n=='function')n=n(S);
  if(S.hp<=0)return dead();
  go(n);
}
function go(id){
  S.sc=id;const sc=SC[id];
  if(sc.end){
    const k=id;if(!M.end.includes(k)){M.end.push(k);saveM()}
    return finish(id)}
  if(S.d=='easy'||sc.cp==1||(sc.cp==2&&S.d!='hard')){S.cpt=null;S.cpt=JSON.stringify(S)}
  saveS();game();
}
function dead(){
  S.dc=(S.dc||0)+1;
  app.innerHTML=`<div class=sp></div><h1 class=rd style="font-size:1.6em;letter-spacing:.2em">СИГНАЛ ПОТЕРЯН</h1><p>Связь оборвалась. Оператор не отвечает.</p><button class=b onclick="revive()">Вернуться к контрольной точке</button><button class=b onclick="menu()">В меню</button><div class=sp></div>`;
}
function revive(){
  if(!S.cpt)return menu();
  const c=S.cpt,dc=S.dc;S=JSON.parse(c);S.cpt=c;S.dc=dc;S.hp=Math.max(S.hp,40);S.san=Math.max(S.san,30);S.u=Math.min(S.u,60);
  saveS();game();
}
function finish(id){
  const sc=SC[id],n=+id.slice(1);
  S=null;LS('s9save',null);cset('s9save',{ts:Date.now()});
  app.innerHTML=`<div class=sp></div><div class=loc>КОНЦОВКА ${n} ИЗ 5${n==4?' // СЕКРЕТНАЯ':''}</div><h1 style="font-size:1.8em;letter-spacing:.15em">${ENDS[id]}</h1><p class=tx style="min-height:0">${sc.x}</p><p class=dm>Все концовки доступны на любой сложности.</p><button class=b onclick="diff()">Начать заново</button><button class=b onclick="menu()">В меню</button><div class=sp></div>`;
}
let tw;
function typer(el,s,done){
  clearInterval(tw);let i=0,fin=0;el.textContent='';
  const d=()=>{if(!fin){fin=1;clearInterval(tw);el.textContent=s;done()}};
  tw=setInterval(()=>{i+=2;el.textContent=s.slice(0,i);if(i>=s.length)d()},14);
  el.onclick=d;
}
function hud(){
  const B=(n,v,c)=>`<div>${n} ${v}<div class=bar><i style="width:${v}%;background:${c}"></i></div></div>`;
  return `<div class=hud>${B('ЗДОРОВЬЕ',S.hp,'#b3261e')}${B('РАССУДОК',S.san,'#7fa6b5')}${B('ФОНАРЬ',S.bat,'#c9a24a')}${B('ВНИМАНИЕ',S.u,'#d4552b')}</div>`;
}
function game(){
  const sc=SC[S.sc];
  if(S.san<35&&Math.random()<.5)note(FK[Math.random()*FK.length|0]);
  const nt=S.nt.map(t=>`<div class=nt>${t}</div>`).join('');S.nt=[];
  const hint=(S.d=='easy'||(S.d=='mid'&&S.san>=70))&&sc.h?`<div class=hint>▸ ${sc.h}</div>`:'';
  const ch=sc.c.map((c,i)=>{
    const l=typeof c.l=='function'?c.l(S):c.l;
    return `<button class=b onclick="choose(${i})">${l}${c.r&&S.d!='hard'?`<small>нужно: ${nm(c.r)}</small>`:''}</button>`}).join('');
  app.innerHTML=hud()+`<div class=loc>ГЛАВА ${sc.ch+1} // ${CH[sc.ch].toUpperCase()}<br>${sc.l}</div>${nt}<div id=tx class=tx></div><div id=ch class=off>${hint}${ch}</div><div class=sp></div><div class=row><button class=b onclick="inv()">Инвентарь ${S.inv.length}/6</button><button class=b onclick="arch(1)">Архив</button><button class=b onclick="menu()">Меню</button></div>`;
  typer(document.getElementById('tx'),gls(sc.x),()=>document.getElementById('ch').classList.remove('off'));
}
function ov(h){const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML='<div>'+h+'<button class=b onclick="document.getElementById(\'ov\').remove()">Закрыть</button></div>';document.body.appendChild(o)}
function inv(m){
  const old=document.getElementById('ov');if(old)old.remove();
  ov(`<div class=loc>ИНВЕНТАРЬ ${S.inv.length}/6</div>${m?`<div class=nt>${m}</div>`:''}`+(S.inv.map((n,i)=>`<button class=b onclick="use(${i})">${n}<small>${IT[n]}</small></button>`).join('')||'<p class=dm>Пусто.</p>'));
}
function use(i){
  const n=S.inv[i];let m=IT[n];
  if(n=='Батарейка'){S.bat=cl(S.bat+50);S.inv.splice(i,1);m='Фонарь заряжен.'}
  else if(n=='Аптечка'){S.hp=cl(S.hp+40);S.inv.splice(i,1);m='Раны перевязаны.'}
  else if(n=='Подавитель сигнала'){S.u=cl(S.u-35);S.inv.splice(i,1);m='Сигналы стихли. Внимание Смотрителя ослабло.'}
  saveS();
  const h=document.querySelector('.hud');if(h)h.outerHTML=hud();
  inv(m);
}

/* ===== экраны ===== */
function menu(){
  const o=document.getElementById('ov');if(o)o.remove();
  clearInterval(tw);
  app.innerHTML=`<div class=sp></div><div class="dm">SECURE CONNECTION // SECTOR-9</div><h1>Э Х О</h1><p>ОПЕРАТОР, ВЫ НА СВЯЗИ?</p><div style="height:14px"></div>
  ${S?`<button class=b onclick="game()">Продолжить<small>Глава ${SC[S.sc].ch+1}: ${CH[SC[S.sc].ch]} // ${DF[S.d].n}</small></button>`:''}
  <button class=b onclick="diff()">Новая игра</button><button class=b onclick="arch()">Архив</button><button class=b onclick="sett()">Настройки</button><button class=b onclick="secrets()">Секреты</button>
  <div class=sp></div><div class=dm>BUILD 0.9.17 // LAST SIGNAL 03:17</div><div class="dm rd">НЕ ОТВЕЧАЙТЕ НА ГОЛОС ИЗ КОРИДОРА</div>`;
}
function diff(sel='mid',conf=0){
  const o=document.getElementById('ov');if(o)o.remove();
  app.innerHTML=`<div class=loc>ВЫБЕРИТЕ УРОВЕНЬ УГРОЗЫ</div>`+Object.keys(DF).map(k=>`<button class="b ${k==sel?'sel':''}" onclick="diff('${k}')">${DF[k].n}<small>${DF[k].d}</small></button>`).join('')+
  `<p class=dm>Выбрано: ${DF[sel].n}. Все пять концовок доступны на любом уровне.</p>${S&&!conf?'<p class=rd>Внимание: текущее сохранение будет перезаписано.</p>':''}
  <button class=b onclick="${S&&!conf?`diff('${sel}',1)`:`start('${sel}')`}">${S&&!conf?'Далее':conf?'Подтвердить: перезаписать сохранение':'Начать'}</button><button class=b onclick="menu()">Назад</button>`;
}
function start(d){
  S={d,sc:'s1a',hp:100,san:100,bat:100,u:0,ds:0,tr:50,inv:d=='easy'?['Батарейка','Батарейка','Аптечка']:d=='mid'?['Батарейка']:[],cl:[],fl:{},us:{},nt:[],cpt:null,dc:0};
  beep();go('s1a');
}
function arch(back){
  const list=S?S.cl:M.seen;
  ov(`<div class=loc>АРХИВ${S?'':' // ВСЕ НАЙДЕННЫЕ МАТЕРИАЛЫ'}</div>`+(list.map(k=>`<div class=cl><b>${CL[k][0]}</b><br><span class=dm>${CL[k][1]}</span></div>`).join('')||'<p class=dm>Улики не найдены.</p>')+`<p class=dm>${list.length} из ${Object.keys(CL).length}</p>`);
}
function secrets(){
  ov(`<div class=loc>СЕКРЕТЫ</div>`+Object.keys(ENDS).map((k,i)=>`<div class=cl><b>Концовка ${i+1}${i==3?' (секретная)':''}</b><br><span class=dm>${M.end.includes(k)?ENDS[k]:'???'}</span></div>`).join('')+
  `<div class=cl><b>Скрытый радиоканал 9</b><br><span class=dm>${M.seen.includes('secret')?'Найден':'???'}</span></div><p class=dm>Секретная концовка требует сопоставить улики из многих глав и не позволить комплексу навязать привычный сценарий.</p>`);
}
function setM(k,v){M[k]=v;saveM();applyM()}
function sett(){
  const o=document.getElementById('ov');if(o)o.remove();
  ov(`<div class=loc>НАСТРОЙКИ</div><p>Эффекты <span class=dm>громкость</span></p><input type=range min=0 max=100 value=${M.fx} oninput="setM('fx',+this.value)">
  <p>Фоновый гул <span class=dm>громкость</span></p><input type=range min=0 max=100 value=${M.amb} oninput="setM('amb',+this.value)">
  <button class=b onclick="setM('gl',M.gl?0:1);sett()">Интенсивные помехи: ${M.gl?'включены':'отключены'}</button>
  <p>Размер текста</p><div class=row>${[14,16,19,22].map(n=>`<button class="b ${M.fs==n?'sel':''}" onclick="setM('fs',${n});sett()">${n}</button>`).join('')}</div>`);
}

/* ===== запуск ===== */
(async()=>{
  M=Object.assign(M,newer(LS('s9meta'),await cget('s9meta'))||{});
  const s=newer(LS('s9save'),await cget('s9save'));
  S=s&&s.sc&&SC[s.sc]&&!SC[s.sc].end?s:null;
  applyM();menu();
})();
</script>
</body>
</html>
